<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/courtside-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- viewport-fit=cover — בלעדיו כל כללי env(safe-area-inset-*) ב-index.css מחזירים 0
         במכשירי notch, והניווט התחתון יושב מתחת ל-home indicator -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CourtSide — הבית של מאמני הכדורסל הישראלי. מחברת אימון, ספריית תרגילים, סגל ונוכחות, יעדים ומשוב לכל שחקן ולו״ז שבועי — הכול בעברית, במקום אחד." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F9FC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141E36" />

    <!-- כתובת קנונית — בלי זה גוגל עלול לאנדקס גם כתובות תצוגה מקדימה
         של ורסל כאילו היו האתר עצמו -->
    <link rel="canonical" href="https://courtsideil.vercel.app/" />

    <!-- Open Graph — תצוגה יפה בשיתוף בוואטסאפ/פייסבוק -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CourtSide — הבית של מאמני הכדורסל הישראלי" />
    <meta property="og:description" content="מחברת אימון, ספריית תרגילים, סגל ונוכחות, יעדים ומשוב לכל שחקן ולו״ז שבועי — כל מה שמאמן צריך, בעברית, במקום אחד." />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:url" content="https://courtsideil.vercel.app/" />
    <meta property="og:image" content="https://courtsideil.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- גופנים: אין כאן שום link לגוגל בכוונה. Rubik ו-Heebo מוגשים מהדומיין
         שלנו דרך חבילות @fontsource ונטענים מ-src/main.jsx, כדי שכתובת ה-IP של
         כל משתמש (ובכללם קטינים) לא תישלח ל-fonts.googleapis.com בכל טעינת דף.
         אין להחזיר כאן preconnect/stylesheet — ה-CSP חוסם את שני הדומיינים. -->

    <title>CourtSide — הבית של מאמני הכדורסל הישראלי</title>

    <!-- JSON-LD — נתונים מובנים לגוגל (schema.org SoftwareApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CourtSide",
      "description": "הבית של מאמני הכדורסל הישראלי — מחברת אימון, ספריית תרגילים, סגל ונוכחות, יעדים ומשוב לכל שחקן ולו״ז שבועי, בעברית.",
      "url": "https://courtsideil.vercel.app/",
      "applicationCategory": "SportsApplication",
      "operatingSystem": "Web",
      "inLanguage": "he",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ILS" }
    }
    </script>
  </head>
  <body>
    <!-- כתב שגיאות עלייה — ES5 בכוונה, כדי שירוץ גם ב-WebView עתיק שנכשל
         על הקוד הראשי. מסך לבן באפליקציה הופך להודעה שאפשר לצלם ולשלוח.
         מציג רק אם השורש עוד ריק (כלומר האפליקציה באמת לא עלתה) — שגיאה
         לא-קריטית אחרי שהמסך כבר חי לא מקפיצה כלום. -->
    <script>
      (function () {
        var shown = false
        function bootFail(msg) {
          try {
            var root = document.getElementById('root')
            if (shown || (root && root.children.length > 0)) return
            shown = true
            var d = document.createElement('div')
            d.setAttribute('dir', 'rtl')
            d.style.cssText = 'position:fixed;top:0;right:0;left:0;background:#B0392F;color:#fff;padding:14px 16px;font:14px/1.6 sans-serif;z-index:99999;word-break:break-word'
            d.textContent = 'CourtSide לא הצליחה לעלות. צלמו את המסך הזה ושלחו למאמן אגם. פרטים: ' + msg
            document.body.appendChild(d)
          } catch (e) { /* אין מה לעשות */ }
        }
        window.addEventListener('error', function (e) {
          bootFail((e && e.message ? e.message : 'שגיאה לא מזוהה') + (e && e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason
          bootFail(r && r.message ? r.message : String(r))
        })
        // WebView עתיק שלא מריץ מודולים בכלל: שום שגיאה לא נזרקת — פשוט
        // כלום לא קורה. אחרי 6 שניות עם שורש ריק, זו התשובה.
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length === 0) bootFail('הדפדפן המובנה במכשיר ישן מדי (לא טוען מודולים). עדכנו את Android System WebView בחנות Play.')
        }, 6000)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
